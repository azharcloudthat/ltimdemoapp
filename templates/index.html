<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LTIMindtree Weather Dashboard | Let's Solve</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <h1><span class="brand">LTIMindtree</span> Weather Dashboard</h1>
    <p class="tagline">Let's solve weather, together.</p>
  </header>

  <main>
    <form id="search-form" role="search">
      <label for="city" class="sr-only">City name</label>
      <input id="city" name="city" type="search" placeholder="Search for a city..."
             autocomplete="off" required minlength="2" maxlength="100">
      <button id="get-weather" type="submit">Get Weather</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="results" aria-label="Weather results" hidden></section>
  </main>

  <footer>
    Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
